[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphweft-prototype"
version = "0.1.0"
description = "Finite graph-bicausal transport and conditional plan audit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "networkx>=3.2"]

[project.optional-dependencies]
test = ["scipy>=1.11"]
browser-test = ["playwright>=1.48,<2"]

[tool.setuptools.packages.find]
include = ["graphweft*"]

[tool.setuptools.package-data]
graphweft = ["web/*.html", "web/*.js", "web/*.css"]

name: GraphWeft verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m unittest discover -s tests -v

  installed-workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[browser-test]'
      - run: python -m playwright install --with-deps chromium
      - name: Exercise the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m graphweft compare "$GITHUB_WORKSPACE/examples/binary_chain.json" --summary
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests/browser" -v
